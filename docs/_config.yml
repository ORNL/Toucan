title: Toucan
description: Performance-portable, parallel-in-time cellular automata for additive manufacturing microstructure simulation
url: "https://ORNL.github.io"
baseurl: "/Toucan"
repository: ORNL/Toucan

remote_theme: just-the-docs/just-the-docs@v0.12.0
color_scheme: toucan
permalink: pretty

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - scripts/
  - vendor/
  - build/
  - Toucan-wordmark.png
  - .bundle/
  - .jekyll-cache/
  - .sass-cache/
  - _site/
  - docs/.bundle/
  - docs/.jekyll-cache/
  - docs/_site/
  - docs/vendor/

defaults:
  - scope:
      path: ""
    values:
      layout: default

search_enabled: true
heading_anchors: true
enable_copy_code_button: true

aux_links:
  "Source":
    - "https://github.com/ORNL/Toucan"

aux_links_new_tab: false

callouts_level: quiet
callouts:
  note:
    title: Note
    color: blue
  important:
    title: Important
    color: green

footer_content: >-
  Toucan is distributed under the BSD 3-Clause License.

sass:
  quiet_deps: true
  silence_deprecations:
    - import
    - global-builtin
    - color-functions
